[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-browsa"
version = "0.1.0"
description = "LangChain integration for Browsa: Phantom cloud browsers for AI agents (browsa.io)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Browsa", email = "support@browsa.io"}]
keywords = ["langchain", "langgraph", "browsa", "browser-automation", "ai-agents", "web-scraping", "cloud-browser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "browsa>=0.3.1",
    "langchain-core>=1.0.0,<2.0.0",
    "typing-extensions>=4.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-socket>=0.7",
    "langchain-tests==1.1.9",
    "langchain>=1.0.0,<2.0.0",
]

[project.urls]
Homepage = "https://browsa.io"
Documentation = "https://browsa.io/docs"
Source = "https://github.com/browsa-io/browsa/tree/main/integrations/langchain-browsa"
Issues = "https://github.com/browsa-io/browsa/issues"

[tool.setuptools.packages.find]
include = ["langchain_browsa*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
langchain_browsa = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "requires_api_key: needs BROWSA_API_KEY and calls the live Browsa API",
]
