# Publishes npm `@browsa/mcp` (browsa-mcp/) with a provenance statement,
# through npm trusted publishing (OIDC). No NPM_TOKEN secret is used. After
# npm has the version, the Release workflow creates the GitHub Release from
# the changelog.
#
# sdks/export-public.sh copies this file to .github/workflows/browsa-mcp-publish.yml
# at the root of github.com/browsa-io/browsa (GitHub only runs workflows from there).
#
# Trigger: push a tag browsa-mcp-v<version> (for example browsa-mcp-v0.8.1) whose
# version equals browsa-mcp/package.json, or run it by hand from the Actions tab.
# @browsa/mcp installs `browsa` from npm, so when it needs a new `browsa`,
# push the browsa-ts tag first and wait for that release.
#
# One-time setup on npmjs.com: package `@browsa/mcp` > Settings > Trusted
# Publisher > GitHub Actions: organization browsa-io, repository browsa,
# workflow filename browsa-mcp-publish.yml, no environment. Until that is done
# the job stops at "Check npm trusted publishing" within seconds and says what
# to enter; it does not run the build first and fail at the end with an E404.
# Trusted publishing needs npm 11.5.1 or later and Node 22.14.0 or later
# (https://docs.npmjs.com/trusted-publishers).
#
# A version that is already on npm (published by hand from a clean checkout)
# is not published again: the job says so and goes on to the release.
#
# The official MCP registry entry (io.browsa/browsa, server.json) is updated
# by hand afterwards with mcp-publisher.

name: Publish @browsa/mcp (npm)

on:
  push:
    tags:
      - 'browsa-mcp-v*.*.*'
  workflow_dispatch:
    inputs:
      skip_trusted_publisher_check:
        description: Skip the trusted publishing check (only if the check itself is at fault)
        type: boolean
        default: false

defaults:
  run:
    working-directory: browsa-mcp

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Mints the OIDC token npm exchanges for a publish credential and signs provenance with.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: browsa-mcp/package-lock.json

      - name: Check the tag matches package.json, server.json and manifest.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "browsa-mcp-v${version}" ]; then
            echo "::error title=Tag and version differ::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          node -e '
            const v = require("./package.json").version, s = require("./server.json"), m = require("./manifest.json");
            const bad = [s.version, ...s.packages.map((p) => p.version), m.version].filter((x) => x !== v);
            if (bad.length) { console.error("::error title=Version::server.json or manifest.json versions", bad, "differ from", v); process.exit(1); }
          '

      - name: Is this version already on npm?
        id: npm
        run: |
          if curl -fsS -o /dev/null "https://registry.npmjs.org/@browsa%2Fmcp/${{ steps.version.outputs.version }}"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Already published::@browsa/mcp ${{ steps.version.outputs.version }} is already on npm. Nothing to publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check npm trusted publishing
        if: steps.npm.outputs.published == 'false' && !inputs.skip_trusted_publisher_check
        working-directory: .
        run: node .github/scripts/npm-trusted-publisher-check.mjs @browsa/mcp browsa-mcp-publish.yml

      - name: Use npm 11.5.1 or later (trusted publishing)
        if: steps.npm.outputs.published == 'false'
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        if: steps.npm.outputs.published == 'false'
        run: npm ci

      - name: Build, typecheck and test
        if: steps.npm.outputs.published == 'false'
        run: |
          npm run build
          npx tsc --noEmit -p .
          npm test

      - name: Check the package contents
        if: steps.npm.outputs.published == 'false'
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map((f) => f.path);
            if (!files.includes("dist/server.js")) { console.error("dist/server.js is missing from the package"); process.exit(1); }
            console.log("Package holds", files.length, "files.");
          '
          rm pack.json

      - name: Publish
        if: steps.npm.outputs.published == 'false'
        # No token: npm exchanges the GitHub OIDC token for a short-lived publish credential.
        run: |
          set -o pipefail
          if ! npm publish --provenance --access public 2>&1 | tee publish.log; then
            if grep -qE 'E404|ENEEDAUTH|E401|E403' publish.log; then
              echo "::error title=npm refused the publish::npm did not accept this workflow as a Trusted Publisher of @browsa/mcp. On npmjs.com > @browsa/mcp > Settings > Trusted Publisher: organization browsa-io, repository browsa, workflow filename browsa-mcp-publish.yml, environment empty. Nothing was published."
            fi
            exit 1
          fi

  release:
    name: GitHub Release
    needs: publish
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
