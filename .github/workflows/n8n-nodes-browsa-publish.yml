# Publishes n8n-nodes-browsa to npm with a provenance statement.
#
# n8n requires verified community nodes to be published from GitHub Actions
# with npm provenance (from 1 May 2026):
# https://docs.n8n.io/integrations/creating-nodes/deploy/submit-community-nodes/
#
# Adapted from the n8n-node CLI template for the public monorepo
# github.com/browsa-io/browsa, where the package lives in integrations/n8n-nodes-browsa/.
# GitHub only runs workflows from the repository root, so this file has to be
# copied to .github/workflows/n8n-nodes-browsa-publish.yml at the root of
# browsa-io/browsa (sdks/export-public.sh does it).
#
# Trigger: push a tag n8n-nodes-browsa-v<version> (for example
# n8n-nodes-browsa-v0.1.0) whose version equals package.json, or run the
# workflow by hand from the Actions tab.
#
# npm auth, one of:
#   A. Trusted publishing (OIDC): on npmjs.com, package settings > Publish
#      access > Trusted Publishers > GitHub Actions, owner browsa-io, repo
#      browsa, workflow n8n-nodes-browsa-publish.yml. Leave NPM_TOKEN unset.
#   B. A granular access token for this package in the repo secret NPM_TOKEN.
# Trusted publishing needs npm 11.5.1 or later and Node 22.14.0 or later
# (https://docs.npmjs.com/trusted-publishers).

name: Publish n8n-nodes-browsa

on:
  push:
    tags:
      - 'n8n-nodes-browsa-v*.*.*'
  workflow_dispatch:

defaults:
  run:
    working-directory: integrations/n8n-nodes-browsa

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: integrations/n8n-nodes-browsa/package-lock.json

      - name: Use npm 11.5.1 or later (trusted publishing)
        run: npm install -g npm@^11.5.1

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "n8n-nodes-browsa-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check the package contents
        # 0.1.1 shipped without the compiled node: a second build after a clean
        # emitted nothing. Build twice, as the release does, and refuse to go on
        # unless the packed tarball holds the compiled node and credential.
        run: |
          npm run build
          npm run build
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map((f) => f.path);
            const need = ["dist/nodes/Browsa/Browsa.node.js", "dist/credentials/BrowsaApi.credentials.js", "dist/nodes/Browsa/GenericFunctions.js"];
            const missing = need.filter((f) => !files.includes(f));
            if (missing.length) { console.error("Missing from the package:", missing); process.exit(1); }
            console.log("Package holds", files.length, "files, including the compiled node and credential.");
          '
          rm pack.json

      - name: Release
        # In GitHub Actions, `n8n-node release` runs lint and build, then
        # `npm publish` with NPM_CONFIG_PROVENANCE=true.
        run: |
          if [ -n "$NPM_TOKEN" ]; then npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"; fi
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The GitHub Release for the tag, with this version's section of
  # integrations/n8n-nodes-browsa/CHANGELOG.md as its notes.
  release:
    name: GitHub Release
    needs: publish
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
